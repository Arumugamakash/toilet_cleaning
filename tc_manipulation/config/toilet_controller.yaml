toilet/controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true  

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    toilet_controller:
      type: joint_trajectory_controller/JointTrajectoryController

toilet/toilet_controller:
  ros__parameters:
    use_sim_time: true  
    joints:
      - seat_joint
      - lid_joint
      - large_button_axis
      - small_button_axis
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
